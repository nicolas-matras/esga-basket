document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:16px 18px\" style-hover=\"background:rgba(255,255,255,.24)\"><span style=\"font:400 30px/1 Anton,sans-serif\">03<\u002Fspan><div><div style=\"font:700 14.5px Archivo,sans-serif\">Cotisation<\u002Fdiv><div style=\"font:500 12.5px Archivo,sans-serif\">Tarifs par catégorie à confirmer<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isClub }}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n<div style=\"position:relative;overflow:hidden;background:#F4F5F8;border-bottom:1px solid rgba(12,27,74,.08)\">\n<div style=\"position:absolute;top:-120px;right:-80px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(30,66,168,.14),transparent 70%);animation:glow 7s ease-in-out infinite\"><\u002Fdiv>\n<div style=\"position:relative;max-width:1180px;margin:0 auto;padding:clamp(30px,4vw,54px) clamp(16px,4vw,32px)\">\n<div style=\"font:700 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:#F26A24\">LE CLUB<\u002Fdiv>\n<h1 style=\"font:400 clamp(40px,6.5vw,84px)/.88 Anton,sans-serif;color:#0C1B4A;margin:16px 0 0;text-transform:uppercase;text-wrap:balance;animation:rise .8s ease both\">Un club de village,<br>un jeu de ville<\u002Fh1>\n<p style=\"font:400 clamp(15px,1.4vw,17px)/1.65 Archivo,sans-serif;color:#42506E;max-width:620px;margin:20px 0 0;text-wrap:pretty\">L'Éveil Sportif Genas Azieu fait pratiquer le basket aux enfants dès 6 ans et engage 15 équipes chaque saison, de l'école de basket aux seniors pré-régionaux. Tout se joue au Complexe Sportif Marcel Gonzales, à Genas.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"max-width:1180px;margin:0 auto;padding:clamp(30px,4vw,50px) clamp(16px,4vw,32px)\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px\">\n<div style=\"border:1px solid rgba(12,27,74,.14);border-radius:14px;padding:24px;background:#fff\" style-hover=\"border-color:#F26A24\">\n<div style=\"font:400 30px/1 Anton,sans-serif;color:#F26A24\">01<\u002Fdiv>\n<div style=\"font:400 24px/1.1 Anton,sans-serif;color:#0C1B4A;margin-top:12px;text-transform:uppercase\">Former avant tout<\u002Fdiv>\n<p style=\"font:500 13.5px/1.6 Archivo,sans-serif;color:#42506E;margin:10px 0 0\">Des éducateurs diplômés à chaque catégorie, une progression pensée de l'U9 aux seniors.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border:1px solid rgba(12,27,74,.14);border-radius:14px;padding:24px;background:#fff\" style-hover=\"border-color:#F26A24\">\n<div style=\"font:400 30px/1 Anton,sans-serif;color:#F26A24\">02<\u002Fdiv>\n<div style=\"font:400 24px/1.1 Anton,sans-serif;color:#0C1B4A;margin-top:12px;text-transform:uppercase\">Respect &amp; collectif<\u002Fdiv>\n<p style=\"font:500 13.5px/1.6 Archivo,sans-serif;color:#42506E;margin:10px 0 0\">Arbitres, adversaires, coéquipiers, bénévoles : au club, personne ne joue seul.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border:1px solid rgba(12,27,74,.14);border-radius:14px;padding:24px;background:#fff\" style-hover=\"border-color:#F26A24\">\n<div style=\"font:400 30px/1 Anton,sans-serif;color:#F26A24\">03<\u002Fdiv>\n<div style=\"font:400 24px/1.1 Anton,sans-serif;color:#0C1B4A;margin-top:12px;text-transform:uppercase\">Ouvert à tous<\u002Fdiv>\n<p style=\"font:500 13.5px/1.6 Archivo,sans-serif;color:#42506E;margin:10px 0 0\">Compétition 5×5, loisir et 3×3 : chacun trouve son niveau et son créneau.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:20px\">\n<div style=\"height:260px;border-radius:14px;background:repeating-linear-gradient(135deg,#d9dde8 0 14px,#cfd4e2 14px 28px);display:flex;align-items:flex-end;padding:18px\"><span style=\"font:400 10.5px 'JetBrains Mono',monospace;color:#5b6684;background:rgba(255,255,255,.88);padding:7px 10px;border-radius:5px\">photo — vestiaire / causerie, 900×700<\u002Fspan><\u002Fdiv> {{ goEquipes }}\">Créneaux d'entraînement<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height:260px;border-radius:14px;background:repeating-linear-gradient(135deg,#d9dde8 0 14px,#cfd4e2 14px 28px);display:grid;place-items:center;font:400 10.5px 'JetBrains Mono',monospace;color:#5b6684\">carte / plan d'accès<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isEquipes }}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n<div style=\"background:#F4F5F8;border-bottom:1px solid rgba(12,27,74,.08)\">\n<div style=\"max-width:1180px;margin:0 auto;padding:clamp(30px,4vw,48px) clamp(16px,4vw,32px)\">\n<div style=\"font:700 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:#F26A24\">ÉQUIPES &amp; CATÉGORIES<\u002Fdiv>\n<h1 style=\"font:400 clamp(40px,6.5vw,80px)/.88 Anton,sans-serif;color:#0C1B4A;margin:14px 0 0;text-transform:uppercase\">15 équipes, une seule couleur<\u002Fh1>\n<p style=\"font:400 15.5px/1.6 Archivo,sans-serif;color:#42506E;max-width:580px;margin:16px 0 0;text-wrap:pretty\">Filtre par catégorie pour voir le championnat, les créneaux et le coach de chaque équipe.<\u002Fp>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:22px\">\n<sc-for list=\"{{ cats }}\" as=\"c\" hint-placeholder-count=\"6\">\n<span style=\"cursor:pointer;font:700 12px Archivo,sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:11px 16px;border-radius:99px;background:{{ c.bg }};color:{{ c.fg }};border:1px solid {{ c.border }}\" sc-camel-on-click=\"{{ c.onClick }}\">{{ c.label }}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"max-width:1180px;margin:0 auto;padding:clamp(26px,3vw,40px) clamp(16px,4vw,32px)\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px\">\n<sc-for list=\"{{ teams }}\" as=\"t\" hint-placeholder-count=\"9\">\n<div style=\"border:1px solid rgba(12,27,74,.13);border-radius:14px;overflow:hidden;background:#fff;transition:transform .25s, etter-spacing:.12em\"><span>CATÉGORIE<\u002Fspan><span>COTISATION<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:12px;padding:14px 16px;font:600 13.5px Archivo,sans-serif;color:#0C1B4A;border-bottom:1px solid rgba(12,27,74,.08)\"><span>École de basket (U7—U9)<\u002Fspan><span style=\"color:#5A6484\">à définir<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:12px;padding:14px 16px;font:600 13.5px Archivo,sans-serif;color:#0C1B4A;border-bottom:1px solid rgba(12,27,74,.08);background:#F9FAFC\"><span>U11 — U13<\u002Fspan><span style=\"color:#5A6484\">à définir<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:12px;padding:14px 16px;font:600 13.5px Archivo,sans-serif;color:#0C1B4A;border-bottom:1px solid rgba(12,27,74,.08)\"><span>U15 — U18<\u002Fspan><span style=\"color:#5A6484\">à définir<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:12px;padding:14px 16px;font:600 13.5px Archivo,sans-serif;color:#0C1B4A;border-bottom:1px solid rgba(12,27,74,.08);background:#F9FAFC\"><span>Seniors compétition<\u002Fspan><span style=\"color:#5A6484\">à définir<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:12px;padding:14px 16px;font:600 13.5px Archivo,sans-serif;color:#0C1B4A\"><span>Loisir 5×5 / 3×3<\u002Fspan><span style=\"color:#5A6484\">à définir<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:10px;font:400 11px 'JetBrains Mono',monospace;color:#5A6484\">montants à renseigner — champ Sanity « tarif » par catégorie<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h2 style=\"font:400 clamp(26px,3.4vw,34px)/1 Anton,sans-serif;color:#0C1B4A;margin:0 0 14px;text-transform:uppercase\">Questions fréquentes<\u002Fh2>\n<div style=\"display:grid;gap:10px\">\n<div style=\"border:1px solid rgba(12,27,74,.13);border-radius:12px;padding:16px 18px;background:#fff\"><div style=\"font:700 13.5px Archivo,sans-serif;color:#0C1B4A\">À partir de quel âge ?<\u002Fdiv><p style=\"font:500 13px/1.6 Archivo,sans-serif;color:#42506E;margin:8px 0 0\">Dès 6 ans à l'école de basket, sur le créneau du mercredi.<\u002Fp><\u002Fdiv>\n<div style=\"border:1px solid rgba(12,27,74,.13);border-radius:12px;padding:16px 18px;background:#fff\"><div style=\"font:700 13.5px Archivo,sans-serif;color:#0C1B4A\">Faut-il du matériel ?<\u002Fdiv><p style=\"font:500 13px/1.6 Archivo,sans-serif;color:#42506E;margin:8px 0 0\">Une paire de chaussures de salle suffit. Le maillot de match est fourni par le club.<\u002Fp><\u002Fdiv>\n<div style=\"border:1px solid rgba(12,27,74,.13);border-radius:12px;padding:16px 18px;background:#fff\"><div style=\"font:700 13.5px Archivo,sans-serif;color:#0C1B4A\">Peut-on jouer sans compétition ?<\u002Fdiv><p style=\"font:500 13px/1.6 Archivo,sans-serif;color:#42506E;margin:8px 0 0\">Oui : le club propose du loisir 5×5 et du 3×3, sans championnat le week-end.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:18px;background:#06091A;color:#fff;border-radius:14px;padding:20px\"><div style=\"font:400 22px/1.1 Anton,sans-serif;text-transform:uppercase\">Une question sur le dossier ?<\u002Fdiv><p style=\"font:500 12.5px/1.6 Archivo,sans-serif;color:#C6CEE6;margin:8px 0 14px\">Écris-nous, on répond sous 48h.<\u002Fp><span style=\"cursor:pointer;display:inline-block;background:#F26A24;color:#06091A;font:700 12.5px Archivo,sans-serif;padding:12px 18px;border-radius:99px\" sc-camel-on-click=\"{{ goContact }}\">Nous contacter<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isPartenaires }}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n<div style=\"background:#F4F5F8;border-bottom:1px solid rgba(12,27,74,.08)\">\n<div style=\"max-width:1180px;margin:0 auto;padding:clamp(30px,4vw,48px) clamp(16px,4vw,32px)\">\n<div style=\"font:700 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:#F26A24\">PARTENAIRES<\u002Fdiv>\n<h1 style=\"font:400 clamp(40px,6.5vw,80px)/.88 Anton,sans-serif;color:#0C1B4A;margin:14px 0 0;text-transform:uppercase\">Votre marque sur le parquet<\u002Fh1>\n<p style=\"font:400 15.5px/1.65 Archivo,sans-serif;color:#42506E;max-width:600px;margin:16px 0 0;text-wrap:pretty\">Plus de 200 licenciés et leurs familles, une quinzaine de rencontres à domicile par saison, un tournoi de trois jours en juin : une visibilité locale réelle, à Genas et dans l'Est lyonnais.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"max-width:1180px;margin:0 auto;padding:clamp(28px,3.5vw,46px) clamp(16px,4vw,32px)\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px\">\n<div style=\"border:1px solid rgba(12,27,74,.14);border-radius:16px;padding:24px;background:#fff\" style-hover=\"border-color:#F26A24;transform:translateY(-4px)\"><div style=\"font:700 10.5px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#5A6484\">PACK<\u002Fdiv><div style=\"font:400 30px/1 Anton,sans-serif;color:#0C1B4A;margin-top:10px;text-transform:uppercase\">Supporter<\u002Fdiv><div style=\"font:500 13px/1.7 Archivo,sans-serif;color:#42506E;margin-top:14px;padding-top:14px;border-top:1px solid rgba(12,27,74,.1)\">Logo sur le site<br>Mention sur les réseaux<br>2 invitations au tournoi<\u002Fdiv><div style=\"font:400 24px/1 Anton,sans-serif;color:#F26A24;margin-top:16px\">montant à définir<\u002Fdiv><\u002Fdiv>\n<div style=\"border:2px solid #F26A24;border-radius:16px;padding:24px;background:#fff;box-shadow:0 18px 40px rgba(242,106,36,.16)\"><div style=\"font:700 10.5px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#F26A24\">LE PLUS CHOISI<\u002Fdiv><div style=\"font:400 30px/1 Anton,sans-serif;color:#0C1B4A;margin-top:10px;text-transform:uppercase\">Club<\u002Fdiv><div style=\"font:500 13px/1.7 Archivo,sans-serif;color:#42506E;margin-top:14px;padding-top:14px;border-top:1px solid rgba(12,27,74,.1)\">Panneau en salle<br>Logo sur les maillots d'échauffement<br>Post dédié + page partenaire<\u002Fdiv><div style=\"font:400 24px/1 Anton,sans-serif;color:#F26A24;margin-top:16px\">montant à définir<\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid rgba(12,27,74,.14);border-radius:16px;padding:24px;background:#0C1B4A;color:#fff\" style-hover=\"transform:translateY(-4px)\"><div style=\"font:700 10.5px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#F26A24\">PACK<\u002Fdiv><div style=\"font:400 30px/1 Anton,sans-serif;margin-top:10px;text-transform:uppercase\">Maillot<\u002Fdiv><div style=\"font:500 13px/1.7 Archivo,sans-serif;color:#C6CEE6;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18)\">Logo sur le maillot de match d'une équipe<br>Présence au tournoi ESGA<br>Reçu fiscal mécénat<\u002Fdiv><div style=\"font:400 24px/1 Anton,sans-serif;color:#F26A24;margin-top:16px\">montant à définir<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<h2 style=\"font:400 clamp(24px,3.2vw,32px)/1 Anton,sans-serif;color:#0C1B4A;margin:36px 0 16px;text-transform:uppercase\">Ils nous soutiennent<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px\">\n<div style=\"height:84px;border:1px dashed rgba(12,27,74,.22);border-radius:10px;display:grid;place-items:center;font:400 10px 'JetBrains Mono',monospace;color:#7A86A1\">logo 240×120<\u002Fdiv>\n<div style=\"height:84px;border:1px dashed rgba(12,27,74,.22);border-radius:10px;display:grid;place-items:center;font:400 10px 'JetBrains Mono',monospace;color:#7A86A1\">logo 240×120<\u002Fdiv>\n<div style=\"height:84px;border:1px dashed rgba(12,27,74,.22);border-radius:10px;display:grid;place-items:center;font:400 10px 'JetBrains Mono',monospace;color:#7A86A1\">logo 240×120<\u002Fdiv>\n<div style=\"height:84px;border:1px dashed rgba(12,27,74,.22);border-radius:10px;display:grid;place-items:center;font:400 10px 'JetBrains Mono',monospace;color:#7A86A1\">logo 240×120<\u002Fdiv>\n<div style=\"height:84px;border:1px dashed rgba(12,27,74,.22);border-radius:10px;display:grid;place-items:center;font:400 10px 'JetBrains Mono',monospace;color:#7A86A1\">logo 240×120<\u002Fdiv>\n<div style=\"height:84px;border:1px dashed rgba(12,27,74,.22);border-radius:10px;display:grid;place-items:center;font:400 10px 'JetBrains Mono',monospace;color:#7A86A1\">logo 240×120<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:26px;background:#F26A24;color:#fff;border-radius:16px;padding:clamp(22px,3vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;align-items:center\">\n<div><div style=\"font:400 clamp(26px,3.4vw,34px)/1 Anton,sans-serif;text-transform:uppercase\">Parlons-en autour d'un match<\u002Fdiv><p style=\"font:500 13.5px/1.6 Archivo,sans-serif;margin:10px 0 0\">Le dossier partenaire complet est disponible sur demande.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end\"><span style=\"cursor:pointer;background:#0C1B4A;color:#fff;font:700 13px Archivo,sans-serif;padding:15px 22px;border-radius:99px\" sc-camel-on-click=\"{{ goContact }}\">Demander le dossier<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isBoutique }}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n<div style=\"max-width:1180px;margin:0 auto;padding:clamp(30px,4vw,48px) clamp(16px,4vw,32px)\">\n<div style=\"font:700 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:#F26A24\">BOUTIQUE<\u002Fdiv>\n<h1 style=\"font:400 clamp(40px,6.5vw,80px)/.88 Anton,sans-serif;color:#0C1B4A;margin:14px 0 0;text-transform:uppercase\">Le textile du club<\u002Fh1>\n<p style=\"font:400 15.5px/1.65 Archivo,sans-serif;color:#42506E;max-width:560px;margin:16px 0 0;text-wrap:pretty\">Commande groupée deux fois par saison : tu choisis, le club commande, tu récupères au gymnase.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:26px\">\n<sc-for list=\"{{ shop }}\" as=\"p\" hint-placeholder-count=\"6\">\n<div style=\"border:1px solid rgba(12,27,74,.13);border-radius:14px;overflow:hidden;background:#fff;transition:transform .25s,box-shadow .25s\" style-hover=\"transform:translateY(-4px);box-shadow:0 18px 40px rgba(12,27,74,.14)\">\n<div style=\"aspect-ratio:1/1;background:repeating-linear-gradient(135deg,#d9dde8 0 14px,#cfd4e2 14px 28px);display:grid;place-items:center;font:400 10px 'JetBrains Mono',monospace;color:#5b6684\">photo produit 800×800<\u002Fdiv>\n<div style=\"padding:16px\">\n<div style=\"font:400 21px/1.1 Anton,sans-serif;color:#0C1B4A;text-transform:uppercase\">{{ p.name }}<\u002Fdiv>\n<div style=\"font:500 12.5px Archivo,sans-serif;color:#5A6484;margin-top:6px\">{{ p.detail }}<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid rgba(12,27,74,.1)\"><span style=\"font:400 20px/1 Anton,sans-serif;color:#F26A24\">{{ p.price }}<\u002Fspan><span style=\"cursor:pointer;font:700 12px Archivo,sans-serif;color:#0C1B4A\" style-hover=\"color:#F26A24\">Ajouter →<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:26px;background:#0C1B4A;color:#fff;border-radius:16px;padding:clamp(22px,3vw,30px);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;align-items:center\">\n<div><div style=\"font:700 10px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#F26A24\">PROCHAINE COMMANDE GROUPÉE<\u002Fdiv><div style=\"font:400 clamp(24px,3.2vw,32px)/1 Anton,sans-serif;margin-top:10px;text-transform:uppercase\">Clôture le 15 octobre<\u002Fdiv><p style=\"font:500 13px/1.6 Archivo,sans-serif;color:#C6CEE6;margin:10px 0 0\">Retrait au gymnase deux semaines après la clôture. Floquage prénom offert.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end\"><span style=\"cursor:pointer;background:#F26A24;color:#06091A;font:700 13px Archivo,sans-serif;padding:15px 22px;border-radius:99px\">Voir mon panier<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:14px;font:400 11px 'JetBrains Mono',monospace;color:#5A6484\">prix et tailles à renseigner — collection gérée dans Sanity<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n<div style=\"background:#F4F5F8;border-bottom:1px solid rgba(12,27,74,.08)\">\n<div style=\"max-width:1180px;margin:0 auto;padding:clamp(30px,4vw,48px) clamp(16px,4vw,32px)\">\n<div style=\"font:700 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:#F26A24\">CONTACT &amp; ACCÈS<\u002Fdiv>\n<h1 style=\"font:400 clamp(40px,6.5vw,80px)/.88 Anton,sans-serif;color:#0C1B4A;margin:14px 0 0;text-transform:uppercase\">On se voit au Gonzales<\u002Fh1>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"max-width:1180px;margin:0 auto;padding:clamp(28px,3.5vw,46px) clamp(16px,4vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;align-items:start\">\n<div>\n<div style=\"display:grid;gap:12px\">\n<div style=\"border:1px solid rgba(12,27,74,.13);border-radius:14px;padding:20px;background:#fff\"><div style=\"font:700 10px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#F26A24\">ADRESSE<\u002Fdiv><div style=\"font:500 14px/1.7 Archivo,sans-serif;color:#0C1B4A;margin-top:10px\">Complexe Sportif Marcel Gonzales<br>2 rue de la Fraternité, 69740 Genas<\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid rgba(12,27,74,.13);border-radius:14px;padding:20px;background:#fff\"><div style=\"font:700 10px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#F26A24\">CONTACT<\u002Fdiv><div style=\"font:500 14px/1.7 Archivo,sans-serif;color:#0C1B4A;margin-top:10px\">president.esgabasket@gmail.com<br>06 88 59 67 20<br>Club FFBB ARA0069090<\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid rgba(12,27,74,.13);border-radius:14px;padding autre<\u002Foption><\u002Fsc-raw-select>\n<textarea rows=\"5\" placeholder=\"Ton message\" style=\"border:1px solid rgba(12,27,74,.18);border-radius:10px;padding:14px 16px;font:500 13.5px Archivo,sans-serif;color:#0C1B4A;outline:none;resize:vertical\"><\u002Ftextarea>\n<span style=\"cursor:pointer;text-align:center;background:#F26A24;color:#fff;font:700 14px Archivo,sans-serif;padding:16px;border-radius:99px;box-shadow:0 8px 22px rgba(242,106,36,.3)\" style-hover=\"background:#0C1B4A\">Envoyer →<\u002Fspan>\n<div style=\"font:400 11px/1.6 'JetBrains Mono',monospace;color:#5A6484\">formulaire branché sur Netlify Forms<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"background:#06091A;color:#fff\">\n<div style=\"max-width:1180px;margin:0 auto;padding:clamp(30px,4vw,46px) clamp(16px,4vw,32px) 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:clamp(20px,3vw,34px)\">\n<div>\n<img src=\"eada7829-e12f-4b21-811e-84d699d5e127\" alt=\"ESGA Genas Azieu\" style=\"width:60px;height:60px;object-fit:contain\">\n<div style=\"font:400 21px/1.1 Anton,sans-serif;margin-top:14px;text-transform:uppercase\">Éveil Sportif<br>Genas Azieu<\u002Fdiv>\n<div style=\"font:500 12.5px/1.6 Archivo,sans-serif;color:#8C97BC;margin-top:10px\">Club affilié FFBB — Comité du Rhône &amp; Métropole de Lyon<\u002Fdiv>\n<\u002Fdiv>\n<div><div style=\"font:700 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.14em;color:#F26A24\">LE CLUB<\u002Fdiv><div style=\"display:grid;gap:9px;margin-top:14px;font:500 13px Archivo,sans-serif;color:#C6CEE6\"><span style=\"cursor:pointer\" style-hover=\"color:#F26A24\" sc-camel-on-click=\"{{ goClub }}\">Histoire &amp; valeurs<\u002Fspan><span style=\"cursor:pointer\" style-hover=\"color:#F26A24\" sc-camel-on-click=\"{{ goClub }}\">Le bureau<\u002Fspan><span style=\"cursor:pointer\" style-hover=\"color:#F26A24\" sc-camel-on-click=\"{{ goEquipes }}\">Équipes &amp; coachs<\u002Fspan><span style=\"cursor:pointer\" style-hover=\"color:#F26A24\" sc-camel-on-click=\"{{ goContact }}\">Bénévoles<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:700 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.14em;color:#F26A24\">PRATIQUE<\u002Fdiv><div style=\"display:grid;gap:9px;margin-top:14px;font:500 13px Archivo,sans-serif;color:#C6CEE6\"><span style=\"cursor:pointer\" style-hover=\"color:#F26A24\" sc-camel-on-click=\"{{ goInscriptions }}\">Inscriptions &amp; tarifs<\u002Fspan><span style=\"cursor:pointer\" style-hover=\"color:#F26A24\" sc-camel-on-click=\"{{ goAgenda }}\">Agenda<\u002Fspan><span style=\"cursor:pointer\" style-hover=\"color:#F26A24\" sc-camel-on-click=\"{{ goResultats }}\">Résultats<\u002Fspan><span style=\"cursor:pointer\" style-hover=\"color:#F26A24\" sc-camel-on-click=\"{{ goBoutique }}\">Boutique<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div>\n<div style=\"font:700 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.14em;color:#F26A24\">NOUS TROUVER<\u002Fdiv>\n<div style=\"font:500 13px/1.7 Archivo,sans-serif;color:#C6CEE6;margin-top:14px\">Complexe Sportif Marcel Gonzales<br>2 rue de la Fraternité, 69740 Genas<br>06 88 59 67 20<br>president.esgabasket@gmail.com<\u002Fdiv>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:14px\"><span style=\"cursor:pointer;border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:8px 14px;font:700 12px Archivo,sans-serif\" style-hover=\"border-color:#F26A24;color:#F26A24\">@esgagenas<\u002Fspan><span style=\"cursor:pointer;border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:8px 14px;font:700 12px Archivo,sans-serif\" style-hover=\"border-color:#F26A24;color:#F26A24\">Facebook<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"max-width:1180px;margin:0 auto;padding:16px clamp(16px,4vw,32px) 26px;border-top:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font:400 11px 'JetBrains Mono',monospace;color:#8C97BC\"><span>© 2026 ESGA BASKET · ARA0069090<\u002Fspan><span>MENTIONS LÉGALES · CONFIDENTIALITÉ<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;page&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;accueil&quot;,&quot;club&quot;,&quot;equipes&quot;,&quot;resultats&quot;,&quot;agenda&quot;,&quot;actus&quot;,&quot;inscriptions&quot;,&quot;partenaires&quot;,&quot;boutique&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;accueil&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Navigation&quot;},&quot;showTicker&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Navigation&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: null, cat: 'Toutes', comp: 'PRM' };\n\n  go(p) {\n    return () => { this.setState({ page: p }); try { window.scrollTo(0, 0); } catch (e) {} };\n  }\n\n  chip(active) {\n    return active\n      ? { bg: '#F26A24', fg: '#fff', border: '#F26A24' }\n      : { bg: 'transparent', fg: '#0C1B4A', border: 'rgba(12,27,74,.2)' };\n  }\n\n  darkChip(active) {\n    return active\n      ? { bg: '#F26A24', fg: '#06091A', border: '#F26A24' }\n      : { bg: 'rgba(255,255,255,.06)', fg: '#C6CEE6', border: 'rgba(255,255,255,.18)' };\n  }\n\n  standingRow(r, highlight) {\n    return {\n      rank: r[0], team: r[1], pts: r[2], played: r[3], diff: r[4],\n      bg: highlight ? 'linear-gradient(90deg,rgba(242,106,36,.22),rgba(242,106,36,.04))' : 'rgba(255,255,255,.05)',\n      border: highlight ? 'rgba(242,106,36,.45)' : 'rgba(255,255,255,.08)',\n      ink: highlight ? '#fff' : '#C6CEE6',\n      rankColor: highlight ? '#F26A24' : '#8C97BC',\n      diffColor: String(r[4]).indexOf('+') === 0 ? '#4ADE80' : (highlight ? '#fff' : '#C6CEE6')\n    };\n  }\n\n  renderVals() {\n    const page = this.state.page ?? this.props.page ?? 'accueil';\n    const navDef = [['accueil', 'Accueil'], ['club', 'Le club'], ['equipes', 'Équipes'], ['resultats', 'Résultats'], ['agenda', 'Agenda'], ['actus', 'Actus'], ['inscriptions', 'Inscriptions'], ['partenaires', 'Partenaires'], ['boutique', 'Boutique'], ['contact', 'Contact']];\n    const nav = navDef.map(([key, label]) => ({\n      key, label, onClick: this.go(key),\n      bar: page === key ? '#F26A24' : 'transparent',\n      color: page === key ? '#0C1B4A' : '#42506E'\n    }));\n\n    const allTeams = [\n      { cat: 'U9', name: 'U9 mixte', champ: 'PLATEAUX', slots: 'Mercredi 14h00 — 15h30\\nGonzales', coach: 'à compléter' },\n      { cat: 'U11', name: 'U11 F', champ: 'DÉPARTEMENTAL', slots: 'Mardi 17h30 — 19h00\\nSamedi matin : match', coach: 'à compléter' },\n      { cat: 'U11', name: 'U11 M', champ: 'DÉPARTEMENTAL', slots: 'Mercredi 16h00 — 17h30\\nSamedi matin : match', coach: 'à compléter' },\n      { cat: 'U13', name: 'U13 F 1', champ: 'DÉPARTEMENTAL', slots: 'Lundi et jeudi 18h00 — 19h30', coach: 'à compléter' },\n      { cat: 'U13', name: 'U13 F 2', champ: 'DÉPARTEMENTAL', slots: 'Lundi et jeudi 18h00 — 19h30', coach: 'à compléter' },\n      { cat: 'U15', name: 'U15 M', champ: 'DÉPARTEMENTAL', slots: 'Mardi et vendredi 19h00 — 20h30', coach: 'à compléter' },\n      { cat: 'U18', name: 'U18 F', champ: 'DÉPARTEMENTAL', slots: 'Mercredi et vendredi 19h30 — 21h00', coach: 'à compléter' },\n      { cat: 'Seniors', name: 'SM1', champ: 'PRÉ-RÉGIONALE', slots: 'Mardi et jeudi 20h30 — 22h30\\nMatch samedi 20h30', coach: 'à compléter' },\n      { cat: 'Seniors', name: 'SM2', champ: 'DM3 POULE B', slots: 'Mercredi et vendredi 20h30 — 22h30', coach: 'à compléter' },\n      { cat: 'Seniors', name: 'SF1', champ: 'DF2 POULE B', slots: 'Lundi et mercredi 20h30 — 22h00', coach: 'à compléter' },\n      { cat: 'Loisir', name: 'Loisir 5×5', champ: 'HORS CHAMPIONNAT', slots: 'Vendredi 21h00 — 23h00', coach: '—' },\n      { cat: 'Loisir', name: '3×3', champ: 'OPEN FFBB', slots: 'Créneau selon saison', coach: '—' }\n    ];\n    const catList = ['Toutes', 'U9', 'U11', 'U13', 'U15', 'U18', 'Seniors', 'Loisir'];\n    const cats = catList.map(label => {\n      const c = this.chip(this.state.cat === label);\n      return { label, bg: c.bg, fg: c.fg, border: c.border, onClick: () => this.setState({ cat: label }) };\n    });\n    const teams = this.state.cat === 'Toutes' ? allTeams : allTeams.filter(t => t.cat === this.state.cat);\n\n    const tables = {\n      PRM: [['1', 'Beaumarchais Basket Lyon', '28', '14', '+96'], ['2', 'CO St Fons Basket', '26', '14', '+41'], ['3', 'Éveil Sportif Genas Azieu', '24', '14', '+118'], ['4', 'AS Andéolaise 2', '22', '14', '−8'], ['5', 'ASC Mionnay', '21', '14', '−17'], ['6', 'AL Irigny Vernaison', '17', '14', '−70'], ['7', 'BC Communay Ternay', '17', '14', '−128'], ['8', 'US Jassans Basket', '15', '14', '−32']],\n      DM3: [['1', 'BC Villefranche 3', '25', '13', '+71'], ['2', 'Décines BC 2', '23', '13', '+44'], ['3', 'Chassieu Basket 2', '22', '13', '+12'], ['4', 'Éveil Sportif Genas Azieu 2', '21', '13', '+9'], ['5', 'Meyzieu Basket 3', '18', '13', '−21'], ['6', 'Saint-Priest BC 3', '16', '13', '−58']],\n      DF2: [['1', 'Bouchoux Basket', '26', '14', '+83'], ['2', 'Éveil Sportif Genas Azieu', '25', '14', '+62'], ['3', 'BC Communay Ternay', '22', '14', '+18'], ['4', 'Beaumarchais Basket Lyon', '20', '14', '−4'], ['5', 'AL Irigny Vernaison', '18', '14', '−39'], ['6', 'CO St Fons Basket', '15', '14', '−77']]\n    };\n    const compDef = [['PRM', 'SM1 · Pré-régionale'], ['DM3', 'SM2 · DM3'], ['DF2', 'SF1 · DF2']];\n    const comps = compDef.map(([key, label]) => {\n      const c = this.darkChip(this.state.comp === key);\n      return { label, bg: c.bg, fg: c.fg, border: c.border, onClick: () => this.setState({ comp: key }) };\n    });\n    const standings = tables[this.state.comp].map(r => this.standingRow(r, r[1].indexOf('Genas') > -1));\n    const homeStandings = tables.PRM.slice(1, 5).map(r => this.standingRow(r, r[1].indexOf('Genas') > -1));\n\n    const shop = [\n      { name: 'Maillot réversible', detail: 'Bleu / blanc · U9 → seniors', price: 'prix à définir' },\n      { name: 'Short de match', detail: 'Bleu marine · logo brodé', price: 'prix à définir' },\n      { name: 'Sweat à capuche', detail: 'Marine · floquage prénom offert', price: 'prix à définir' },\n      { name: 'T-shirt échauffement', detail: 'Blanc · logo aigle orange', price: 'prix à définir' },\n      { name: 'Sac de sport', detail: '40 L · compartiment chaussures', price: 'prix à définir' },\n      { name: 'Gourde ESGA', detail: '750 ml · inox', price: 'prix à définir' }\n    ];\n\n    return {\n      page, nav, cats, teams, comps, standings, homeStandings, shop,\n      ticker: this.props.showTicker ?? true,\n      isAccueil: page === 'accueil', isClub: page === 'club', isEquipes: page === 'equipes',\n      isResultats: page === 'resultats', isAgenda: page === 'agenda', isActus: page === 'actus',\n      isInscriptions: page === 'inscriptions', isPartenaires: page === 'partenaires',\n      isBoutique: page === 'boutique', isContact: page === 'contact',\n      goAccueil: this.go('accueil'), goClub: this.go('club'), goEquipes: this.go('equipes'),\n      goResultats: this.go('resultats'), goAgenda: this.go('agenda'), goActus: this.go('actus'),\n      goInscriptions: this.go('inscriptions'), goPartenaires: this.go('partenaires'),\n      goBoutique: this.go('boutique'), goContact: this.go('contact')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
