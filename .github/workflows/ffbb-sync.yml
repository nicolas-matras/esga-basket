# Synchronisation des classements et résultats FFBB.
#
# Tourne ici plutôt que chez l'hébergeur : le site est statique, sans
# adaptateur ni runtime. Y ajouter une fonction planifiée obligerait à
# réintroduire tout l'appareillage de fonctions pour un simple cron, alors que
# la synchro écrit dans Sanity et enchaîne sur le job de déploiement.
#
# Les horaires cron de GitHub sont en UTC. La FFBB met ses données à jour vers
# 23h30, d'où le passage du matin.

name: Synchronisation FFBB

on:
  schedule:
    # Tous les soirs à 23h UTC.
    #
    # Les horaires cron de GitHub sont en UTC et ignorent l'heure d'été : une
    # heure fixe glisse donc d'une heure dans l'année. 23h UTC tombe à minuit
    # l'hiver et 1h du matin l'été — dans les deux cas APRÈS la mise à jour
    # nocturne de la FFBB, observée entre 23h30 et 23h45. Choisir 22h UTC
    # donnerait 23h l'hiver, soit trop tôt une partie de l'année.
    - cron: '0 23 * * *'
    # Samedi et dimanche à 20h UTC (21h ou 22h à Paris) : les résultats saisis
    # juste après les matchs remontent le soir même.
    - cron: '0 20 * * 6,0'
  workflow_dispatch:
    inputs:
      simulation:
        description: 'Simulation (n’écrit rien dans Sanity)'
        type: boolean
        default: false
      forcer:
        description: 'Forcer la réécriture complète (ignore les empreintes)'
        type: boolean
        default: false

concurrency:
  # Deux synchros en parallèle écriraient les mêmes documents.
  group: ffbb-sync
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # Vrai seulement si la FFBB a réellement publié quelque chose de neuf.
      # En simulation, le script s'arrête avant d'écrire ce drapeau : une
      # simulation ne met donc jamais le site en ligne.
      a_change: ${{ steps.synchroniser.outputs.a_change }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      - name: Tests
        # TZ=UTC volontairement : c'est le fuseau des machines de build, et
        # c'est sous celui-là qu'un bug de fuseau se manifeste.
        run: TZ=UTC node --test tools/ffbb/*.test.ts apps/web/src/lib/*.test.ts

      - name: Synchroniser
        id: synchroniser
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          FFBB_CODE_CLUB: ARA0069090
        run: |
          ARGS=""
          [ "${{ inputs.simulation }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.forcer }}" = "true" ] && ARGS="$ARGS --forcer"
          node tools/ffbb/index.ts $ARGS

      - name: Ce qui va suivre
        # Le drapeau `a_change` commande tout l'enchaînement. On l'affiche au
        # lieu de le supposer : « false » veut dire que la synchro a bien
        # tranché, une valeur VIDE voudrait dire qu'elle n'a rien écrit du tout
        # — donc que le site ne sera plus jamais remis en ligne, en silence.
        run: |
          case "${{ steps.synchroniser.outputs.a_change }}" in
            true)  echo "Des données ont changé : le job « deployer » va suivre." ;;
            false) echo "Rien n'a changé : pas de déploiement. C'est le cas normal." ;;
            *)     echo "::warning::Drapeau a_change vide : le site ne sera pas remis en ligne. Vérifier tools/ffbb/index.ts." ;;
          esac

  # Mise en ligne, seulement si la synchro a modifié quelque chose. Reconstruire
  # un site identique à chaque nuit consommerait le quota de builds pour rien.
  deployer:
    needs: synchroniser
    if: needs.synchroniser.outputs.a_change == 'true'
    uses: ./.github/workflows/deployer.yml
    secrets: inherit
