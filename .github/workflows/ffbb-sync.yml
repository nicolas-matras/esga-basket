# Synchronisation des classements et résultats FFBB.
#
# Tourne ici plutôt que chez Netlify : le site est statique, sans adaptateur ni
# runtime. Y ajouter une Scheduled Function obligerait à réintroduire tout
# l'appareillage de fonctions pour un simple cron, alors que la synchro écrit
# dans Sanity et se contente d'appeler un build hook.
#
# Les horaires cron de GitHub sont en UTC. La FFBB met ses données à jour vers
# 23h30, d'où le passage du matin.

name: Synchronisation FFBB

on:
  schedule:
    # Tous les soirs à 23h UTC.
    #
    # Les horaires cron de GitHub sont en UTC et ignorent l'heure d'été : une
    # heure fixe glisse donc d'une heure dans l'année. 23h UTC tombe à minuit
    # l'hiver et 1h du matin l'été — dans les deux cas APRÈS la mise à jour
    # nocturne de la FFBB, observée entre 23h30 et 23h45. Choisir 22h UTC
    # donnerait 23h l'hiver, soit trop tôt une partie de l'année.
    - cron: '0 23 * * *'
    # Samedi et dimanche à 20h UTC (21h ou 22h à Paris) : les résultats saisis
    # juste après les matchs remontent le soir même.
    - cron: '0 20 * * 6,0'
  workflow_dispatch:
    inputs:
      simulation:
        description: 'Simulation (n’écrit rien dans Sanity)'
        type: boolean
        default: false
      forcer:
        description: 'Forcer la réécriture complète (ignore les empreintes)'
        type: boolean
        default: false

concurrency:
  # Deux synchros en parallèle écriraient les mêmes documents.
  group: ffbb-sync
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      - name: Tests
        # TZ=UTC volontairement : c'est le fuseau des machines de build, et
        # c'est sous celui-là qu'un bug de fuseau se manifeste.
        run: TZ=UTC node --test tools/ffbb/*.test.ts apps/web/src/lib/*.test.ts

      - name: Synchroniser
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
          FFBB_CODE_CLUB: ARA0069090
        run: |
          ARGS=""
          [ "${{ inputs.simulation }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.forcer }}" = "true" ] && ARGS="$ARGS --forcer"
          node tools/ffbb/index.ts $ARGS
