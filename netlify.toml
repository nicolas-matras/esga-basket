# Déploiement du site public. Rien d'autre n'est déployé ici :
# le Studio Sanity s'héberge chez Sanity (`pnpm --filter @esga/studio deploy`).

[build]
  # Netlify installe déjà les dépendances dans sa propre étape : on ne
  # réinstalle pas ici, on construit seulement l'app web du monorepo.
  command = "pnpm --filter @esga/web build"
  publish = "apps/web/dist"

[build.environment]
  # Version alignée sur les `engines` réels des dépendances : plusieurs
  # paquets (eslint 10, astro-eslint-parser) refusent Node 22.12.
  NODE_VERSION = "24.16.0"
  # Pas de PNPM_VERSION : le champ `packageManager` du package.json fait foi.
  # Deux sources de vérité finissent toujours par diverger.

# Les polices sont versionnées par leur contenu et ne changent jamais.
[[headers]]
  for = "/polices/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
